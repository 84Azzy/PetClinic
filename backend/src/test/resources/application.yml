spring:
  datasource:
    url: jdbc:h2:mem:petclinic;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  # test/resources/application.yml 会遮蔽 main 中的同名文件，因此测试环境也必须显式关闭全部 AI 模型。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
app:
  jwt:
    secret: TestSecretKeyMustBeAtLeastThirtyTwoBytesLongForPetClinic
    expiration-minutes: 60
