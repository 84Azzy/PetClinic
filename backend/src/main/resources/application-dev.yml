spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petclinic}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  storage:
    cos:
      enabled: ${COS_ENABLED:false}
      region: ${COS_REGION:ap-shanghai}
      bucket: ${COS_BUCKET:}
      prefix: ${COS_PREFIX:petclinic/dev}
      credential-mode: static
      secret-id: ${TENCENTCLOUD_SECRET_ID:}
      secret-key: ${TENCENTCLOUD_SECRET_KEY:}
