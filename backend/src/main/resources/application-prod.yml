spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  database:
    initialize: false
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage:
    cos:
      enabled: true
      region: ${COS_REGION}
      bucket: ${COS_BUCKET}
      prefix: ${COS_PREFIX:petclinic/prod}
      credential-mode: cvm-role
      role-name: ${COS_CVM_ROLE_NAME}
