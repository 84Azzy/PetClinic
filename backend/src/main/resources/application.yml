server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: smart-petclinic
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petclinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  database:
    initialize: ${APP_DATABASE_INITIALIZE:false}
  jwt:
    secret: ${JWT_SECRET:PetClinicDemoSecretKeyMustBeAtLeastThirtyTwoBytesLong2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
