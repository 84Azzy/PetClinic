server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  application:
    name: smart-petclinic
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  http:
    client:
      connect-timeout: 3s
      read-timeout: 15s
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
      embedding: none
      # 不恰当：只关闭 embedding 不够，OpenAI Starter 还会默认创建语音、转写、图片和审核模型，
      # 在未配置 API Key 时会使普通业务也无法启动。本项目只使用 chat，因此显式关闭其余模型。
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          temperature: 0.2
          # 工具调用会占用一部分输出额度；额度过低时模型可能完成工具调用却没有剩余 token 输出最终 JSON。
          max-tokens: 2400
          parallel-tool-calls: false
          response-format:
            type: JSON_OBJECT
    retry:
      max-attempts: 1
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  database:
    initialize: ${APP_DATABASE_INITIALIZE:false}
  jwt:
    secret: ${JWT_SECRET:PetClinicDemoSecretKeyMustBeAtLeastThirtyTwoBytesLong2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage:
    image:
      max-size: 5MB
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
    cos:
      enabled: false
