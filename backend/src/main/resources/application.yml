server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: smart-petclinic
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petclinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  http:
    client:
      connect-timeout: 3s
      read-timeout: 15s
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
      embedding: none

    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          temperature: 0.2
          max-tokens: 1200
          parallel-tool-calls: false
          response-format:
            type: JSON_OBJECT
    retry:
      max-attempts: 1
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  database:
    initialize: ${APP_DATABASE_INITIALIZE:false}
  jwt:
    secret: ${JWT_SECRET:PetClinicDemoSecretKeyMustBeAtLeastThirtyTwoBytesLong2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
