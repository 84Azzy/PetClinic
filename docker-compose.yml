services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-petclinic}
      TZ: Asia/Shanghai
    ports: ["${DB_PORT:-3306}:3306"]
    volumes:
      - petclinic_mysql:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-petclinic}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-DockerPetClinicSecretKeyMustBeAtLeastThirtyTwoBytesLong}
      APP_DATABASE_INITIALIZE: ${APP_DATABASE_INITIALIZE:-false}
      # Spring AI 使用 OpenAI 兼容协议访问 DeepSeek，所以 provider 必须写 openai。
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-none}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      COS_ENABLED: ${COS_ENABLED:-false}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_PREFIX: ${COS_PREFIX:-petclinic/dev}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
    ports: ["${SERVER_PORT:-8080}:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]
volumes:
  petclinic_mysql:
